<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#F7F4EF"/>
  <!-- Emblema de marca central -->
  <g transform="translate(400, 140)">
    <!-- Rombo exterior de costura -->
    <polygon points="0,-75 75,0 0,75 -75,0" fill="none" stroke="#D4C2A8" stroke-width="2"/>
    <polygon points="0,-65 65,0 0,65 -65,0" fill="#F3EEE6" stroke="#56657A" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Gancho icono estilizado -->
    <path d="M 0 -45 C 12 -45 20 -35 20 -24 C 20 -14 10 -8 0 0" fill="none" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 0 0 L -38 22 L 38 22 Z" fill="#111111" stroke="#111111" stroke-width="2"/>
    <!-- Aguja e hilo -->
    <circle cx="0" cy="38" r="3" fill="#56657A"/>
  </g>
  <!-- Texto corporativo -->
  <text x="400" y="275" font-family="'Poppins', sans-serif" font-size="36" font-weight="800" letter-spacing="6" fill="#111111" text-anchor="middle">FASHIONSTYLE</text>
  <line x1="330" y1="295" x2="470" y2="295" stroke="#D4C2A8" stroke-width="2"/>
  <text x="400" y="325" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" letter-spacing="5" fill="#56657A" text-anchor="middle">BOUTIQUE &amp; ATELIER</text>
</svg>
