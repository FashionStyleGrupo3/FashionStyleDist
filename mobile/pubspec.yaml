name: fashion_style_mobile
description: "Aplicación móvil oficial de Fashion Style boutique conectada al backend Laravel."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & Realtime
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # State Management & Local Persistence
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.5

  # Navigation & Routing
  go_router: ^14.8.0

  # UI, Fonts & Icons
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Media, File Picking & Webview
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.1

  # Document Generation & Sharing
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
