name: Desplegar Fashion Style Web en GitHub Pages

on:
  push:
    branches: ['main']
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Instalar dependencias y compilar Vite
        working-directory: ./web
        env:
          VITE_API_BASE_URL: https://fashionstyle.api.adsocidm.com/public/api
          VITE_STORAGE_BASE_URL: https://fashionstyle.api.adsocidm.com/storage
        run: |
          npm ci
          npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir carpeta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
