name: Build Fashion Style Flutter Mobile

on:
  push:
    branches: ['main', 'develop']
    paths:
      - 'mobile/**'
      - '.github/workflows/build-flutter-mobile.yml'
  workflow_dispatch:

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar plataformas nativas
        run: flutter create . --project-name fashion_style_mobile --org com.fashionstyle

      - name: Instalar dependencias Dart
        run: flutter pub get

      - name: Análisis estático de código
        run: flutter analyze

      - name: Compilar APK de Producción (Android)
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=API_BASE_URL=https://fashionstyle.api.adsocidm.com/public/api

      - name: Sincronizar APK compilado en instalador/ (solo develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk instalador/fashionstyle-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instalador/fashionstyle-release.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): sincronizar fashionstyle-release.apk compilado en CI [skip ci]"
            git pull --rebase origin develop || true
            git push origin HEAD:develop
          fi

      - name: Compilar versión Web Móvil de Flutter
        run: flutter build web --release --base-href /FashionStyleDist/mobile/ --dart-define=API_BASE_URL=https://fashionstyle.api.adsocidm.com/public/api

      - name: Subir APK a Artifacts de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: fashion-style-mobile-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Subir Flutter Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fashion-style-flutter-web
          path: mobile/build/web
